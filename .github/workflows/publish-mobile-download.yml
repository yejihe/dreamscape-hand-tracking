name: Publish Dreamscape Hand Android direct downloads
on:
  push:
    branches:
      - experiment/phase2-2-depth-probe
    paths:
      - '.github/workflows/publish-mobile-download.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write

jobs:
  publish:
    if: github.repository == 'yejihe/dreamscape-hand-tracking'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Pages source (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: pages-source
          persist-credentials: true
      - name: Retrieve verified 2.2.1 ARM64 build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 40156591131 --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion' | grep -x success
          gh run download 40156591131 --repo "$GITHUB_REPOSITORY" --name dreamscape-hand-phase21-debug-apk --dir "$RUNNER_TEMP/apk-artifact"
          test -s "$RUNNER_TEMP/apk-artifact/app-debug.apk"
          unzip -l "$RUNNER_TEMP/apk-artifact/app-debug.apk" | grep -q 'lib/arm64-v8a/'
          echo "APK sha256:"
          sha256sum "$RUNNER_TEMP/apk-artifact/app-debug.apk"
      - name: Publish a downloadable preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/apk-artifact/app-debug.apk"
          TAG="v0.2.2.1-arm64-test"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "experiment/phase2-2-depth-probe" \
              --title "Dreamscape Hand 2.2.1 · ARM64 test APK" \
              --notes "For vivo S30 ARM64 only. Experimental hand landmark overlay and ARCore scene depth; NOT validated 3D drawing." --prerelease --latest=false
          gh release upload "$TAG" "$APK#Dreamscape-Hand-2.2.1-arm64.apk" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish direct APK to the existing GitHub Pages main/root site
        working-directory: pages-source
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp "$RUNNER_TEMP/apk-artifact/app-debug.apk" downloads/Dreamscape-Hand-2.2.1-arm64.apk
          cat > downloads/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Dreamscape Hand 安装包</title>
          <style>body{font-family:system-ui,sans-serif;max-width:580px;margin:10vh auto;padding:20px;color:#eef;background:#081b2e;line-height:1.7}a{display:block;border-radius:12px;padding:16px;color:#071a27;background:#9bedf1;text-align:center;font-size:18px;font-weight:bold}small{display:block;margin-top:22px;color:#ccd}</style>
          <h1>🌌 Dreamscape Hand</h1>
          <p>Phase 2.2.1 — vivo S30 / Android ARM64 测试版</p>
          <a href="./Dreamscape-Hand-2.2.1-arm64.apk" download>📱 下载 APK 安装包（约 20 MB）</a>
          <small>仅为手部关键点与候选场景深度实验。未实现稳定三维指尖定位，也不是完整 VR/MR 绘画应用。请不要误装到其他架构手机。</small>
          </html>
          HTML
          git config user.name "dreamscape-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/index.html downloads/Dreamscape-Hand-2.2.1-arm64.apk
          git commit -m "Publish Phase 2.2.1 ARM64 preview APK under Pages downloads"
          git push origin HEAD:main
      - name: Explicitly request Pages rebuild (GITHUB_TOKEN pushes don't auto-build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '{status: .status, url: .url}'
          echo "Direct download: https://yejihe.github.io/dreamscape-hand-tracking/downloads/Dreamscape-Hand-2.2.1-arm64.apk"
