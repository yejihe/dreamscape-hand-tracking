<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dreamscape · 手指捏合测试</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#081322;color:#f5f8ff;font-family:system-ui,-apple-system,sans-serif}
#scene{position:fixed;inset:0;overflow:hidden;background:#101b29}video,canvas{position:absolute;width:100%;height:100%;object-fit:cover}video{transform:scaleX(-1)}canvas{pointer-events:none}
#top{position:fixed;top:env(safe-area-inset-top);left:10px;right:10px;padding:12px 14px;background:#071728dc;border:1px solid #536887;border-radius:16px;z-index:2;font-size:14px;line-height:1.5}
h1{margin:0 0 4px;font-size:17px}#state{color:#7ee8da;font-weight:700}#info{color:#dae5ff}#bottom{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:10px;right:10px;z-index:2;display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:13px;padding:13px 14px;background:#87bbff;color:#0c1a30;font-weight:700;font-size:16px;flex:1;min-width:100px}button.secondary{background:#263c59;color:white}
#note{position:fixed;bottom:105px;left:10px;right:10px;z-index:2;font-size:12px;color:#e3ecfa;background:#081527ba;padding:7px 10px;border-radius:9px}
</style></head>
<body><div id="scene"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas></div>
<div id="top"><h1>🌌 Dreamscape · 捏合识别实验 R10</h1><div id="state">尚未启动</div><div id="info">点击「启动摄像头」，对准一只手。捏合拇指和食指会出现红色轨迹。</div></div>
<div id="note">当前仅验证视觉手势＋屏幕二维轨迹；不代表 ARCore 三维定位或 VR 已完成。请先不要购买硬件。</div>
<div id="bottom"><button id="start">启动摄像头</button><button class="secondary" id="clear">清除轨迹</button><button class="secondary" id="flip">切换镜头</button></div>
<script type="module">
const video=document.querySelector('#video'),canvas=document.querySelector('#overlay'),ctx=canvas.getContext('2d');
const state=document.querySelector('#state'),info=document.querySelector('#info'),start=document.querySelector('#start');
let model,stream,active=false,busy=false,face='user',lastT=-1,lastFrame=-1,down=false,points=[],strokes=[],lastDraw=0,miss=0;
function status(s){state.textContent=s}
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0)}
window.addEventListener('resize',resize);resize();
function xy(p){const w=canvas.clientWidth,h=canvas.clientHeight,vw=video.videoWidth||w,vh=video.videoHeight||h;const scale=Math.max(w/vw,h/vh),sw=vw*scale,sh=vh*scale;
return {x:(w-sw)/2+(1-p.x)*sw,y:(h-sh)/2+p.y*sh}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function paint(lm){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);
for(const stroke of strokes){ctx.strokeStyle='#ff627e';ctx.lineWidth=6;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();stroke.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}
if(!lm)return;
const connections=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
ctx.lineWidth=2;ctx.strokeStyle='#63deff';for(const [a,b] of connections){let p=xy(lm[a]),q=xy(lm[b]);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}
ctx.fillStyle=down?'#ff5877':'#7cf4ae';const tip=xy(lm[8]);ctx.beginPath();ctx.arc(tip.x,tip.y,12,0,Math.PI*2);ctx.fill()
}
let initializing=false;
const timeout=(promise,ms,label)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+'超时（'+Math.round(ms/1000)+'秒）')),ms))]);
async function init(){
 if(active){status('识别已经启动');return}
 if(initializing){status('正在启动中，请看这里的进度提示');return}
 initializing=true;start.textContent='启动中…';
 try{
  status('R10 · 第一步：申请摄像头权限');
  await timeout(camera(),12000,'摄像头启动');
  status('R10 · 摄像头已开启，准备模型');
  const base=new URL('./vendor/mediapipe/',document.baseURI);
  const mod=await timeout(import(base.href+'vision_bundle.mjs'),15000,'识别程序加载');
  status('R10 · 加载识别引擎');
  const vision=await timeout(mod.FilesetResolver.forVisionTasks(base.href),15000,'WASM 加载');
  status('R10 · 初始化手部模型');
  model=await timeout(mod.HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:base.href+'hand_landmarker.task',delegate:'CPU'},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.55,minTrackingConfidence:.5}),30000,'模型初始化');
  active=true;status('R10 · 已启动！请伸出手');requestAnimationFrame(loop);
  start.textContent='已启动';
 }catch(e){
  status('R10 启动失败：'+e.message);
  info.textContent='故障阶段：'+(e.stack||String(e)).slice(0,500);
  start.textContent='重新尝试';
 }finally{initializing=false}
}
async function camera(){
if(stream)stream.getTracks().forEach(t=>t.stop());
stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:face},width:{ideal:640},height:{ideal:480},frameRate:{ideal:30}}});
video.srcObject=stream;await video.play();lastFrame=-1;
}
async function loop(){
if(!active)return;requestAnimationFrame(loop);
if(busy || video.readyState<2 || video.currentTime===lastFrame)return;
busy=true;lastFrame=video.currentTime;
try{
const now=performance.now(),res=model.detectForVideo(video,now),lm=res.landmarks?.[0];
if(!lm){miss++;if(miss>3){down=false;points=[];status('未找到手：请伸入镜头范围')}paint(null);return}
miss=0;
const palm=Math.max(dist(lm[5],lm[17]),.025),ratio=dist(lm[4],lm[8])/palm;
const prev=down; if(!down && ratio<.42)down=true;else if(down && ratio>.65)down=false;
if(down&&!prev){points=[];strokes.push(points)}if(!down)points=[];
const tip=xy(lm[8]);
if(down && (!points.length||dist(points[points.length-1],tip)>3))points.push(tip);
status(down?'🔴 捏合中 · 正在绘画':'🟢 已识别手 · 张开停止');
info.textContent='捏合比值 '+ratio.toFixed(2)+' ｜ 笔画 '+strokes.length+' ｜ 仅 2D 测试';
paint(lm);
}catch(e){status('识别异常：'+e.message);active=false;start.disabled=false}
finally{busy=false}
}
start.addEventListener('click',init);
document.querySelector('#clear').addEventListener('click',()=>{strokes=[];points=[];paint(null)});
document.querySelector('#flip').addEventListener('click',async()=>{if(!active)return;face=face==='user'?'environment':'user';down=false;points=[];try{await camera();status('镜头已切换')}catch(e){status('切换失败：'+e.message)}});
window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));
</script></body></html>
